name: Versioned documentation

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'website/**'
      - 'scripts/docs_site.py'
      - 'scripts/test_docs_site.py'
      - 'gradle.properties'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'website/**'
      - 'scripts/docs_site.py'
      - 'scripts/test_docs_site.py'
      - 'gradle.properties'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: website/requirements.txt
      - run: python -m pip install -r website/requirements.txt
      - name: Validate release snapshots and versioning tools
        run: |
          python scripts/docs_site.py check
          python -m unittest discover -s scripts -p 'test_docs_site.py'
      - name: Build all documentation versions
        run: python scripts/docs_site.py build --base-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: build/docs-site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
